<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NLCD Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="sidepanel" class="sidepanel closed">
  <button id="sidepanel-toggle" aria-label="Open/Close Panel">&#x203A;</button>
  <div class="sidepanel-content">
    <label for="year">Year</label>
    <select id="year"></select>
    <label for="land-class">Land Class</label>
    <div class="land-class-row">
      <div class="select-with-chip">
        <span class="color-chip" id="land-class-chip" aria-hidden="true"></span>
        <select id="land-class"></select>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<div id="frameWrap">
  <iframe id="viewer" allow="camera; geolocation; autoplay; fullscreen"></iframe>
</div>
<script src="./colors.js" defer></script>
<script src="./js/main.js" defer></script>
</body>
</html>
